name: Build Test

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
      - run: npx tsc --noEmit
      - run: npx --yes --package=vitest@4.1.11 --package=@rolldown/binding-linux-x64-gnu@1.2.4 vitest run
