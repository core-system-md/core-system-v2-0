name: Build Test

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
      - run: npx tsc --noEmit
      - run: npm install --no-save --package-lock=false --include=optional vitest@4.1.11
      - run: npx --no-install vitest@4.1.11 run
