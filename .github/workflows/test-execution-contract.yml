name: Master Test Execution Contract

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_ref:
        description: Base branch/ref to compare
        required: false
        default: main
      candidate_ref:
        description: Candidate commit/ref; defaults to current workflow SHA
        required: false
        default: ''

permissions:
  contents: read

jobs:
  execution-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # The repository's migration 012 creates project helper functions in auth.
          # Supabase's managed local Postgres images introduced the auth-schema
          # restriction after the 2025-04-21 rollout. Pin the pre-restriction CLI
          # stack so the existing migration history can be replayed for CI/E2E.
          version: 2.20.12

      - name: Install dependencies
        run: npm install

      - name: Prepare isolated migration replay
        run: node tools/prepare-local-migrations.mjs

      - name: Start isolated Supabase
        run: supabase start

      - name: Export isolated Supabase environment
        shell: bash
        run: |
          supabase status -o env > .supabase.env
          strip_wrapping_quotes() {
            printf '%s' "$1" | sed -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//"
          }
          api_url=$(strip_wrapping_quotes "$(grep '^API_URL=' .supabase.env | cut -d= -f2-)")
          anon_key=$(strip_wrapping_quotes "$(grep '^ANON_KEY=' .supabase.env | cut -d= -f2-)")
          service_role_key=$(strip_wrapping_quotes "$(grep '^SERVICE_ROLE_KEY=' .supabase.env | cut -d= -f2-)")
          printf 'VITE_SUPABASE_URL=%s\n' "$api_url" >> "$GITHUB_ENV"
          printf 'VITE_SUPABASE_ANON_KEY=%s\n' "$anon_key" >> "$GITHUB_ENV"
          printf 'SUPABASE_URL=%s\n' "$api_url" >> "$GITHUB_ENV"
          printf 'SUPABASE_SERVICE_ROLE_KEY=%s\n' "$service_role_key" >> "$GITHUB_ENV"
          printf 'E2E_TENANT_ID=20000000-0000-4000-8000-000000000001\n' >> "$GITHUB_ENV"
          printf 'E2E_BASE_URL=http://127.0.0.1:4173\n' >> "$GITHUB_ENV"

      - name: Validate complete migration chain
        run: npm run test:migrations -- --apply

      - name: Resolve comparison refs
        id: refs
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DISPATCH_BASE: ${{ inputs.base_ref }}
          DISPATCH_CANDIDATE: ${{ inputs.candidate_ref }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          if [ -n "$PR_BASE_SHA" ]; then
            echo "base=$PR_BASE_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "base=${DISPATCH_BASE:-main}" >> "$GITHUB_OUTPUT"
          fi
          echo "candidate=${DISPATCH_CANDIDATE:-$WORKFLOW_SHA}" >> "$GITHUB_OUTPUT"

      - name: Check validation tooling syntax
        run: |
          node --check tools/test-execution-setup.mjs
          node --check tools/test-execution-runner.mjs
          node --check tools/migration-validation.mjs
          node --check tools/prepare-local-migrations.mjs
          node --check e2e/run-full.mjs
          node --check e2e/reconcile.mjs
          node --check e2e/role-routes.spec.mjs
          node --check e2e/security-negative.spec.mjs

      - name: Generate decision plan
        run: |
          node tools/test-execution-setup.mjs \
            --base "${{ steps.refs.outputs.base }}" \
            --candidate "${{ steps.refs.outputs.candidate }}" \
            --output test-execution-plan.json

      - name: Validate decision plan
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const p=JSON.parse(fs.readFileSync('test-execution-plan.json','utf8')); const required=['contract_version','baseline','candidate','merge_base','changed_files','impact','affected_domains','affected_modules','affected_roles','affected_workflows','security_impact','data_impact','required_engineering','required_e2e','required_negative_tests','required_reconciliation','regression_level']; for (const k of required) if (!(k in p)) throw new Error('missing '+k); if(!/^R[0-4]$/.test(p.regression_level)) throw new Error('invalid regression'); for (const k of ['required_e2e','required_negative_tests','required_reconciliation']) if(!Array.isArray(p[k])) throw new Error(k+' must be array'); console.log(JSON.stringify({regression_level:p.regression_level, impact:p.impact, affected_roles:p.affected_roles, required_engineering:p.required_engineering, required_e2e:p.required_e2e, required_negative_tests:p.required_negative_tests, required_reconciliation:p.required_reconciliation, available_validation:p.available_validation}, null, 2));"

      - name: Run contract self-test
        run: npm run test:contract

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run selected validation scope
        env:
          TEST_EXECUTION_RUN_E2E: 'true'
        run: node tools/test-execution-runner.mjs test-execution-plan.json

      - name: Stop isolated Supabase
        if: ${{ always() }}
        run: supabase stop

      - name: Upload execution plan
        if: ${{ always() && hashFiles('test-execution-plan.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: test-execution-plan
          path: test-execution-plan.json
          if-no-files-found: error
