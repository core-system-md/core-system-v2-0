name: Master Test Execution Contract

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_ref:
        description: Base branch/ref to compare
        required: false
        default: main
      candidate_ref:
        description: Candidate commit/ref; defaults to current workflow SHA
        required: false
        default: ''

permissions:
  contents: read

jobs:
  execution-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Resolve comparison refs
        id: refs
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DISPATCH_BASE: ${{ inputs.base_ref }}
          DISPATCH_CANDIDATE: ${{ inputs.candidate_ref }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          if [ -n "$PR_BASE_SHA" ]; then
            echo "base=$PR_BASE_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "base=${DISPATCH_BASE:-main}" >> "$GITHUB_OUTPUT"
          fi
          echo "candidate=${DISPATCH_CANDIDATE:-$WORKFLOW_SHA}" >> "$GITHUB_OUTPUT"

      - name: Check Decision Engine syntax
        run: node --check tools/test-execution-setup.mjs && node --check tools/test-execution-runner.mjs

      - name: Generate decision plan
        run: |
          node tools/test-execution-setup.mjs \
            --base "${{ steps.refs.outputs.base }}" \
            --candidate "${{ steps.refs.outputs.candidate }}" \
            --output test-execution-plan.json

      - name: Validate decision plan
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const p=JSON.parse(fs.readFileSync('test-execution-plan.json','utf8')); const required=['contract_version','baseline','candidate','merge_base','changed_files','impact','affected_domains','affected_modules','affected_roles','affected_workflows','security_impact','data_impact','required_engineering','required_e2e','required_negative_tests','required_reconciliation','regression_level']; for (const k of required) if (!(k in p)) throw new Error('missing '+k); if(!/^R[0-4]$/.test(p.regression_level)) throw new Error('invalid regression'); console.log(JSON.stringify({regression_level:p.regression_level, impact:p.impact, affected_roles:p.affected_roles, required_engineering:p.required_engineering, required_e2e:p.required_e2e, required_negative_tests:p.required_negative_tests, required_reconciliation:p.required_reconciliation}, null, 2));"

      - name: Run contract self-test
        run: npm run test:contract

      - name: Run selected validation scope
        env:
          TEST_EXECUTION_RUN_E2E: 'true'
        run: node tools/test-execution-runner.mjs test-execution-plan.json

      - name: Upload execution plan
        if: ${{ always() && hashFiles('test-execution-plan.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: test-execution-plan
          path: test-execution-plan.json
          if-no-files-found: error
